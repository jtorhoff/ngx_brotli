# NGINX configuration for script/test_stream.py.
#
# Covers the parts of the filter module that script/run-tests.sh does not:
# streaming (unknown Content-Length) responses, and the lifetime of the Brotli
# encoder instance. Do not run this by hand - test_stream.py owns the process
# lifecycle, the fixtures and the port preflight.
#
# "debug" is accepted by release builds too (it simply produces no debug
# output); the driver skips the memory tests unless nginx has --with-debug.

daemon off;
master_process off;

error_log logs/error.log debug;
pid logs/nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log off;

  types {
    text/html html;
    text/plain txt;
    text/css css;
    application/javascript js;
  }
  default_type application/octet-stream;

  gzip_vary on;

  brotli on;
  brotli_comp_level 6;
  # brotli_window is deliberately left unset so the suite exercises the
  # compiled-in default.
  brotli_types text/html text/plain text/css application/javascript;
  # brotli_min_length is deliberately left unset so the suite exercises the
  # compiled-in default.

  # The abort tests drive disconnects explicitly, so nothing here should time
  # out on its own.
  send_timeout 60s;

  server {
    listen 127.0.0.1:8899;
    server_name localhost;
    root html;

    # The test upstream replies with Transfer-Encoding: chunked and no
    # Content-Length, so with buffering off the body reaches the filter as a
    # stream of unknown size. Re-proxying our own static files would NOT do:
    # nginx forwards the upstream Content-Length, and the filter would still
    # know the response size.
    location /stream/ {
      proxy_pass http://127.0.0.1:8901;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    # Same upstream, but with buffering left on, as it is by default. nginx
    # then hands the filter buffers carrying neither "flush" nor "last_buf",
    # which is what lets the filter hold input back until it knows how big the
    # response is. With buffering off (above) every buffer is flush-marked and
    # no deferral is possible.
    location /buffered/ {
      proxy_pass http://127.0.0.1:8901/stream/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_read_timeout 300s;
    }

    # Lets the upstream pick the response status, so the filter's status
    # handling can be checked against a real proxied response rather than one
    # nginx generated itself.
    location /status/ {
      proxy_pass http://127.0.0.1:8901/status/;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
    }

    # Buffering on, so nginx hands the filter buffers with no flush marker.
    # Used to check time to first byte on a slowly-produced response.
    location /dribble {
      proxy_pass http://127.0.0.1:8901/dribble;
      proxy_set_header Accept-Encoding "";
      proxy_buffering on;
      proxy_read_timeout 300s;
    }

    # An upstream that sends a little and then stalls forever. Lets a client
    # disconnect while the filter is parked waiting for more input, which is
    # the only route to the pool cleanup handler.
    location /slow {
      proxy_pass http://127.0.0.1:8901;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }
}
